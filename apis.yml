aid: spark-capital
name: Spark Capital
description: >-
  Spark Capital is a multi-stage venture capital firm founded in 2005 by Paul Conway, Santo Politi,
  Todd Dagres, and Bijan Sabet, with offices in San Francisco, New York, and Boston. Spark is a
  generalist firm that partners with founders from seed through growth across consumer internet,
  enterprise software, artificial intelligence, gaming, crypto, fintech, infrastructure, hardware and
  semiconductors, life sciences, aerospace, and the future of work. The firm invests from a family of
  early-stage funds (most recently a $700M fund in 2024) and dedicated growth funds (most recently a
  $1.4B fund in 2024), and press reports have placed its assets under management in the range of
  $12-15 billion. Spark first became widely known for leading Twitter's Series B in 2008 and has since
  backed a run of defining companies including Slack, Discord, Snap, Coinbase, Affirm, Plaid, Cruise,
  Oculus, Scale AI, Ramp, Deel, and Anthropic, whose Series C investment the firm turned into one of
  venture's largest recent markups. Spark rebranded in 2020 with design studio Pentagram around its
  distinctive dog-themed identity, and publishes a curated set of portfolio companies rather than a
  full list.
